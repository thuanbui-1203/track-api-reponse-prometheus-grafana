name: prometheus-grafana-demo

services:
  app:
    build: ./app
    container_name: demo-app
    environment:
      PORT: "8000"
      APP_VERSION: "1.0.0"
    ports:
      - "8000:8000"
    restart: unless-stopped

  loadgen:
    build: ./app
    container_name: demo-loadgen
    command: ["python", "loadgen.py"]
    environment:
      TARGET: "http://app:8000"
    depends_on:
      - app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: demo-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    container_name: demo-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/demo-app.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
